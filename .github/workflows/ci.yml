name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: Pytest with coverage
        run: |
          mkdir -p reports
          pytest -q --maxfail=1 --disable-warnings \
            --junitxml=reports/junit-${{ matrix.python-version }}.xml \
            --cov=app --cov=tests \
            --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
            --cov-report=term-missing

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          path: reports

  deploy:
    name: Stage deploy (mock)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    environment:
      name: staging
      url: https://example.com/staging
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: stage-reports

      - name: Validate deployment secrets
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_JWT: ${{ secrets.STAGING_JWT }}
        run: |
          test -n "$STAGING_DB_URL" || (echo "STAGING_DB_URL is required" && exit 1)
          test -n "$STAGING_JWT" || (echo "STAGING_JWT is required" && exit 1)
          echo "Secrets for staging deployment are present (values masked)."

      - name: Mock deployment
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_JWT: ${{ secrets.STAGING_JWT }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          echo "Starting staged deployment promotion..."
          ls -R stage-reports || true
          echo "Deploying application build to ${STAGING_API_URL:-https://example.com/staging} (dry-run)."
          python - <<'PY'
          import textwrap, json, os
          manifest = {
              "target": os.environ.get("STAGING_API_URL", "https://example.com/staging"),
              "db_url_masked": "***",
              "jwt_secret_masked": "***",
          }
          print("Rendered deployment manifest:")
          print(textwrap.indent(json.dumps(manifest, indent=2), "  "))
          PY
