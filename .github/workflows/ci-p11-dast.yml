name: P11 - DAST (OWASP ZAP baseline)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - p11-dast-zap
    paths:
      - "app/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "compose.yaml"
      - "docker-compose.yml"
      - ".github/workflows/ci-p11-dast.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dast-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-dast-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P11

      - name: Run application
        env:
          DATABASE_URL: sqlite+aiosqlite:///./zap-baseline.db
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          echo "UVICORN_PID=$!" >> "$GITHUB_ENV"
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 2; done'

      - name: ZAP Baseline scan
        env:
          ZAP_TARGET: http://127.0.0.1:8000
        run: |
          docker run --rm --network host -v "$PWD":/zap/wrk owasp/zap2docker-stable \
            zap-baseline.py \
              -t "$ZAP_TARGET" \
              -r zap_baseline.html \
              -J zap_baseline.json \
              -d \
              -I \
              -m 5 || true
          mv zap_baseline.* EVIDENCE/P11/ || true

      - name: Stop application
        if: always()
        run: |
          if [ -n "${UVICORN_PID:-}" ]; then
            kill "$UVICORN_PID" 2>/dev/null || true
            wait "$UVICORN_PID" 2>/dev/null || true
          fi

      - name: Show application logs on failure
        if: failure()
        run: |
          echo "::group::uvicorn.log"
          cat uvicorn.log || true
          echo "::endgroup::"

      - name: Upload P11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
